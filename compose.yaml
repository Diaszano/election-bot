services:
  election-bot:
    image: election-bot
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATA_SOURCE_MODE: ${DATA_SOURCE_MODE:-simulation}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_SESSION_DB_PATH: ${WHATSAPP_SESSION_DB_PATH:-/data/whatsapp-session.db}
      WHATSAPP_ALLOWED_RECIPIENTS: ${WHATSAPP_ALLOWED_RECIPIENTS:-}
      WHATSAPP_DIGEST_INTERVAL: ${WHATSAPP_DIGEST_INTERVAL:-15m}
      WHATSAPP_EDIT_MIN_INTERVAL: ${WHATSAPP_EDIT_MIN_INTERVAL:-60s}
      WHATSAPP_RECIPIENT_MIN_INTERVAL: ${WHATSAPP_RECIPIENT_MIN_INTERVAL:-3s}
      WHATSAPP_CONNECT_TIMEOUT: ${WHATSAPP_CONNECT_TIMEOUT:-30s}
      WHATSAPP_RECONNECT_ENABLED: ${WHATSAPP_RECONNECT_ENABLED:-true}
      WHATSAPP_TELEMETRY_ENABLED: ${WHATSAPP_TELEMETRY_ENABLED:-true}
      SQLITE_PATH: /data/elections.db
      HTTP_LISTEN_ADDRESS: ':8080'
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    volumes:
      - election-data:/data
    ports:
      - '127.0.0.1:8080:8080'
    networks: [elections]
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, /election-bot, --healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  election-data:
networks:
  elections:
